<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>טיול משפחת פרידמן - רומניה 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #eef2f3;
            --card-bg: #ffffff;
            --primary-teal: #0d9488;
            --dark-teal: #115e59;
            --accent-mint: #2dd4bf;
            --light-mint: #f0fdfa;
            --text-dark: #1e293b;
        }

        body {
            font-family: 'Arimo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 15px;
            padding-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .header {
            background: linear-gradient(135deg, var(--dark-teal), var(--primary-teal));
            color: white;
            padding: 30px 20px;
            border-radius: 24px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(13, 148, 136, 0.15);
        }

        .header h1 { margin: 10px 0 0; font-size: 24px; font-weight: bold; }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
        }

        .logo-img {
            max-width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .welcome-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 30px;
            border: 2px solid var(--border-color);
            box-shadow: 0 6px 20px rgba(0,0,0,0.05);
        }

        .welcome-card h2 {
            color: var(--dark-teal);
            font-size: 28px;
            margin: 0 0 10px 0;
        }

        .welcome-card h3 {
            color: var(--primary-teal);
            font-size: 20px;
            margin: 0 0 30px 0;
            font-weight: normal;
        }

        .feedback-section {
            background: var(--light-mint);
            padding: 20px;
            border-radius: 16px;
            border: 1px dashed var(--primary-teal);
        }

        .feedback-section p {
            font-weight: bold;
            color: var(--dark-teal);
            margin-top: 0;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--primary-teal);
            font-family: 'Arimo', sans-serif;
            font-size: 15px;
            resize: vertical;
            min-height: 120px;
            margin-bottom: 15px;
        }

        textarea:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.3);
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--primary-teal), var(--accent-mint));
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 10px rgba(13, 148, 136, 0.2);
            transition: transform 0.2s;
            font-family: 'Arimo', sans-serif;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .footer {
            text-align: center;
            font-size: 12.5px;
            color: #7f8c8d;
            margin-top: 20px;
            padding: 22px;
            border-top: 2px dashed var(--accent-mint);
            background-color: #fff9e6;
            border-radius: 16px;
            line-height: 1.6;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo-container">
                <img src="1.jpg" alt="לוגו טיול משפחת פרידמן" class="logo-img" onerror="this.src='https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=200'">
            </div>
            <h1>🇷🇴 טיול משפחת פרידמן - רומניה</h1>
        </div>

        <div class="welcome-card">
            <h2>איזה כיף שנהניתם! 🎉</h2>
            <h3>נתראה בטיול הבא, הדס</h3>

            <div class="feedback-section">
                <p>איך היה לכם? אשמח לשמוע חוויות!</p>
                <textarea id="reviewText" placeholder="ספרו לי כאן איך היה הטיול, מה הכי אהבתם, ואיך הייתה החוויה הכללית..."></textarea>
                <button class="btn-submit" onclick="sendWhatsApp()">שלחו אליי לווטסאפ 💚</button>
            </div>
        </div>

        <div class="footer">
            <strong>כל הזכויות שמורות להדס טרכטר - יועצת טיולים בארץ ובעולם 050-5685356</strong><br>
            אין להעביר ללא אישור מפורש. העובר על כך עובר על גזל לפי דין תורה וחוקי המקום.
        </div>
    </div>

    <script>
        function sendWhatsApp() {
            var text = document.getElementById('reviewText').value.trim();
            if(text === "") {
                alert("אנא כתבו כמה מילים לפני השליחה 😊");
                return;
            }
            // המספר שלך כולל קידומת בינלאומית של ישראל (972) ללא האפס הראשון
            var phoneNumber = "972505685356"; 
            var message = "היי הדס, הנה חוות הדעת שלנו על הטיול ברומניה: %0A%0A" + encodeURIComponent(text);
            
            // פתיחת הקישור לווטסאפ
            window.open("https://wa.me/" + phoneNumber + "?text=" + message, "_blank");
        }
    </script>

</body>
</html>
